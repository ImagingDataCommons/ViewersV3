name: Update IDC packages

# package.json follows the main branch of the IDC GCP extension and mode, but
# every build installs the commits pinned in pnpm-lock.yaml. This job moves
# those pins to the latest main and opens (or refreshes) a pull request, so
# new extension and mode changes reach the viewer as a reviewable commit.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  # Lets the extension and mode repos ask for an update right after a merge.
  repository_dispatch:
    types: [idc-package-updated]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'ImagingDataCommons/ViewersV3'
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH: chore/update-idc-packages
      PACKAGES: '@idc/gcp-extension @idc/gcp-mode'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: master
          persist-credentials: false

      - name: Compare pinned and latest commits
        id: compare
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pinned() { grep -oE "ohif-$1/tar.gz/[0-9a-f]{40}" "$2" | head -1 | sed 's#.*/##'; }
          latest() { git ls-remote "https://github.com/ImagingDataCommons/ohif-$1" refs/heads/main | cut -f1; }

          # The lockfile of an update PR that is still open and based on the
          # current master, if any. One based on an older master is redone.
          proposed=''
          open_pr=$(gh pr list --head "$BRANCH" --base master --state open --json number --jq '.[0].number // empty')
          if [ -n "$open_pr" ] && git fetch --depth 2 origin "$BRANCH" &&
            [ "$(git rev-parse FETCH_HEAD^)" = "$(git rev-parse HEAD)" ]; then
            proposed=$(mktemp)
            git show FETCH_HEAD:pnpm-lock.yaml > "$proposed"
          fi

          changed=false
          proposed_is_latest=true
          summary=''
          for repo in gcp-extension gcp-mode; do
            from=$(pinned "$repo" pnpm-lock.yaml)
            to=$(latest "$repo")
            if [ -z "$from" ] || [ -z "$to" ]; then
              echo "::error::Could not read the pinned or latest commit of ohif-$repo"
              exit 1
            fi
            if [ "$from" != "$to" ]; then
              changed=true
              summary+="- ohif-${repo}: [\`${from:0:7}...${to:0:7}\`](https://github.com/ImagingDataCommons/ohif-${repo}/compare/${from}...${to})"$'\n'
            fi
            if [ -z "$proposed" ] || [ "$(pinned "$repo" "$proposed")" != "$to" ]; then
              proposed_is_latest=false
            fi
          done
          if [ "$changed" = true ] && [ "$proposed_is_latest" = true ]; then
            echo "The open update PR already has the latest commits."
            changed=false
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          {
            echo 'summary<<EOF'
            printf '%s' "$summary"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          echo "Changed: $changed"
          printf '%s' "$summary"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.compare.outputs.changed == 'true'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: steps.compare.outputs.changed == 'true'
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Update the lockfile
        if: steps.compare.outputs.changed == 'true'
        run: pnpm update -r $PACKAGES --lockfile-only

      # Builds from the updated lockfile the way idc-deploy-shell/buildViewer.sh
      # does. Pull requests opened with the workflow token start no other
      # workflows, so this is the check that the update installs and builds.
      - name: Install and build
        if: steps.compare.outputs.changed == 'true'
        env:
          PUBLIC_URL: /v3/
          NODE_OPTIONS: --max-old-space-size=6000
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Open or refresh the pull request
        if: steps.compare.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.compare.outputs.summary }}
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'The lockfile did not change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add -- pnpm-lock.yaml
          git commit -m 'chore(deps): update IDC GCP extension and mode' -m "$SUMMARY"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"

          body=$(printf '%s\n\n%s\n\n%s\n' \
            'Moves the IDC packages in `pnpm-lock.yaml` to the latest commit on their `main` branch.' \
            "$SUMMARY" \
            'The lockfile was installed with `--frozen-lockfile` and the viewer was built in the workflow run that opened this PR. This branch is refreshed on every run while the PR is open.')
          number=$(gh pr list --head "$BRANCH" --base master --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --body "$body"
          else
            gh pr create --base master --head "$BRANCH" \
              --title 'chore(deps): update IDC GCP extension and mode' --body "$body"
          fi
